<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5ef">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <title>auto-recipe</title>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">MY RECIPE BOOK</p>
        <h1>auto-recipe</h1>
      </div>
      <button id="clearFilters" class="text-button" type="button">リセット</button>
    </header>

    <main class="layout">
      <section class="search-panel" aria-label="レシピを探す">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="材料や料理名で探す（例：豚肉）" autocomplete="off">
        </label>
        <div class="filter-group">
          <h2>カテゴリ</h2>
          <div id="categoryFilters" class="chips"></div>
        </div>
        <div class="filter-group">
          <h2>主要材料</h2>
          <div id="ingredientFilters" class="chips"></div>
        </div>
        <p id="resultCount" class="result-count"></p>
        <div id="recipeList" class="recipe-list" aria-live="polite"></div>
      </section>

      <section id="recipeDetail" class="recipe-detail" aria-live="polite">
        <div class="empty-detail">
          <span class="empty-icon">🍳</span>
          <h2>レシピを選んでください</h2>
          <p>手元にある材料や料理名から探せます。</p>
        </div>
      </section>
    </main>

    <script src="js/viewer.js" type="module"></script>
  </body>
</html>
