<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <title>レシピを追加 | auto-recipe</title>
  </head>
  <body>
    <header class="app-header">
      <div><p class="eyebrow">RECIPE INBOX</p><h1 id="pageTitle">レシピを追加</h1></div>
      <a class="header-link secondary" href="/">レシピ一覧へ</a>
    </header>
    <main class="admin-layout">
      <section id="importCard" class="admin-card">
        <h2>取り込み元</h2>
        <form id="importForm">
          <div class="import-tabs" role="tablist" aria-label="取り込み方法">
            <button id="urlTab" class="import-tab active" type="button" role="tab" aria-selected="true" aria-controls="urlPanel" tabindex="0">URLから</button>
            <button id="fileTab" class="import-tab" type="button" role="tab" aria-selected="false" aria-controls="filePanel" tabindex="-1">ファイルから</button>
          </div>
          <div id="urlPanel" class="import-panel" role="tabpanel" aria-labelledby="urlTab">
            <label>レシピのURL <input id="urlInput" type="url" placeholder="https://..." autocomplete="url"></label>
          </div>
          <div id="filePanel" class="import-panel" role="tabpanel" aria-labelledby="fileTab" hidden>
            <label>レシピのファイル <input id="fileInput" type="file" accept=".txt,.pdf,.jpg,.jpeg,.png,.webp"></label>
            <p class="field-help">対応形式：PDF、画像、テキスト（最大15MB）</p>
          </div>
          <button id="importButton" class="primary-button" type="submit">レシピを取り込む</button>
        </form>
        <div id="loadingStatus" class="loading-status" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span><strong>レシピを読み取っています</strong><small>通常は数十秒ほどかかります。この画面を閉じずにお待ちください。</small></span>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section id="editor" class="admin-card" hidden>
        <div class="editor-heading"><h2 id="editorTitle">取り込んだ内容を確認</h2><span id="editorHelp">保存前に内容を確認してください</span></div>
        <form id="recipeForm">
          <input id="recipeId" type="hidden">
          <label>タイトル <input id="titleInput" required></label>
          <div class="form-grid">
            <label>元の人数 <input id="servingsInput" type="number" min="1"></label>
            <label>調理時間（分） <input id="timeInput" type="number" min="1"></label>
          </div>
          <div class="section-heading"><h3>材料</h3><button type="button" class="small-button" id="addIngredient">材料を追加</button></div>
          <div id="ingredientsEditor"></div>
          <div class="section-heading"><h3>手順</h3><button type="button" class="small-button" id="addStep">手順を追加</button></div>
          <div id="stepsEditor"></div>
          <label>タグ（カンマ区切り） <input id="tagsInput"></label>
          <label>メモ（1行1件） <textarea id="notesInput" rows="4"></textarea></label>
          <button class="primary-button" type="submit">この内容で保存</button>
          <p id="saveError" class="save-error" aria-live="polite"></p>
        </form>
        <section id="dangerZone" class="danger-zone" aria-labelledby="dangerZoneTitle" hidden>
          <h3 id="dangerZoneTitle">危険な操作</h3>
          <p>このレシピのデータと、すべての保存履歴を削除します。この操作は元に戻せません。</p>
          <button id="deleteRecipe" class="danger-button" type="button">このレシピを完全に削除</button>
        </section>
      </section>
    </main>
    <dialog id="deleteDialog" class="confirm-dialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogDescription">
      <form method="dialog">
        <h2 id="deleteDialogTitle">レシピを完全に削除しますか？</h2>
        <p id="deleteDialogDescription"></p>
        <p class="confirm-warning">一覧、レシピデータ、すべての保存履歴が削除されます。この操作は元に戻せません。</p>
        <div class="confirm-actions">
          <button id="cancelDelete" class="secondary-button" value="cancel">キャンセル</button>
          <button id="confirmDelete" class="danger-button danger-button-solid" type="button">完全に削除</button>
        </div>
      </form>
    </dialog>
    <script src="js/admin.js" type="module"></script>
  </body>
</html>
