<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <title>auto-recipe 登録</title>
  </head>
  <body>
    <header class="app-header">
      <div><p class="eyebrow">RECIPE INBOX</p><h1>レシピを登録</h1></div>
      <a class="text-button" href="/">ビューアへ</a>
    </header>
    <main class="admin-layout">
      <section class="admin-card">
        <h2>入力</h2>
        <form id="importForm">
          <label>URL <input id="urlInput" type="url" placeholder="https://..."></label>
          <p class="or">または</p>
          <label>ファイル <input id="fileInput" type="file" accept=".txt,.pdf,.jpg,.jpeg,.png,.webp"></label>
          <button class="primary-button" type="submit">LLMで変換する</button>
        </form>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section id="editor" class="admin-card" hidden>
        <div class="editor-heading"><h2>確認・修正</h2><span>保存前に内容を確認してください</span></div>
        <form id="recipeForm">
          <input id="recipeId" type="hidden">
          <label>タイトル <input id="titleInput" required></label>
          <div class="form-grid">
            <label>元の人数 <input id="servingsInput" type="number" min="1"></label>
            <label>調理時間（分） <input id="timeInput" type="number" min="1"></label>
          </div>
          <div class="section-heading"><h3>材料</h3><button type="button" class="small-button" id="addIngredient">材料を追加</button></div>
          <div id="ingredientsEditor"></div>
          <div class="section-heading"><h3>手順</h3><button type="button" class="small-button" id="addStep">手順を追加</button></div>
          <div id="stepsEditor"></div>
          <label>タグ（カンマ区切り） <input id="tagsInput"></label>
          <label>メモ（1行1件） <textarea id="notesInput" rows="4"></textarea></label>
          <button class="primary-button" type="submit">確定保存する</button>
          <p id="saveError" class="save-error" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="js/admin.js" type="module"></script>
  </body>
</html>
